<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product - T-Shirt Shop</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="navbar"><div class="wrap container"><div class="brand">T-Shirt Shop</div><nav class="nav-links"><a href="index.html">Home</a><a href="category.html">Categories</a><a href="cart.html">Cart</a><a href="login.html">Login</a></nav></div></header>
  <main class="container">
    <div id="product-wrap" style="display:grid;grid-template-columns:320px 1fr;gap:18px;align-items:start"></div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = parseInt(params.get('id')) || 1;
    const item = window.appData.tshirtData.find(x=>x.id===id);
    const wrap = document.getElementById('product-wrap');
    if(!item){ wrap.innerHTML='<p>Product not found</p>'; }
    else{
      wrap.innerHTML = `<div style="background:var(--card);padding:14px;border-radius:12px"><img src="${item.img}" style="width:100%;border-radius:10px"></div><div style="background:var(--card);padding:14px;border-radius:12px"><h2>${item.name}</h2><div class="small">Category: ${item.category}</div><div style="margin-top:8px"><span class="price">$${item.price}</span> <span class="discount">${item.discount}% off</span></div><p style="margin-top:12px" class="small">${item.description}</p><div style="margin-top:16px"><button id="addBtn" class="btn">Add to Cart</button></div></div>`;
      document.getElementById('addBtn').addEventListener('click', ()=>{
        if(!shopHelpers.requireLogin()) return; cartApi.addToCart(item,1); alert('Added to cart');
      });
    }
  </script>
</body>
</html>
