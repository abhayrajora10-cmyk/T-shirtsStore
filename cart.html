<!doctype html>
<html>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart - T-Shirt Shop</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="navbar"><div class="wrap container"><div class="brand">T-Shirt Shop</div><nav class="nav-links"><a href="index.html">Home</a><a href="category.html">Categories</a><a href="cart.html">Cart</a><a href="login.html">Login</a></nav></div></header>
  <main class="container">
    <h3>Your Cart</h3>
    <div id="cart-area" style="display:grid;grid-template-columns:2fr 1fr;gap:18px">
      <div id="items"></div>
      <div id="checkout" class="kpi"></div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/cart.js"></script>
  <script>
    if(!shopHelpers.requireLogin()){
      document.getElementById('items').innerHTML='<p class="small">Please login to see your cart.</p>';
    } else {
      renderCart();
    }
    function renderCart(){
      const items = cartApi.getCart();
      const el = document.getElementById('items'); el.innerHTML='';
      if(items.length===0){ el.innerHTML='<p>Your cart is empty.</p>'; document.getElementById('checkout').innerHTML=''; return; }
      items.forEach(it=>{
        const div = document.createElement('div'); div.className='card';
        div.innerHTML = `<div style="display:flex;gap:12px"><img src="${it.img}" style="width:100px;height:100px;object-fit:cover;border-radius:8px"><div><h4>${it.name}</h4><div class="small">$${it.price} • <span class="discount">${it.discount}% off</span></div><div style="margin-top:8px;"><label class="small">Qty</label><input type="number" min="1" value="${it.qty||1}" data-id="${it.id}" class="input qty" style="width:80px"></div><button class="btn remove" data-id="${it.id}" style="margin-top:8px">Remove</button></div></div>`;
        el.appendChild(div);
      });
      // attach events
      document.querySelectorAll('.remove').forEach(b=>b.addEventListener('click', e=>{ cartApi.removeFromCart(parseInt(e.target.dataset.id)); renderCart(); }));
      document.querySelectorAll('.qty').forEach(inp=>inp.addEventListener('change', e=>{ const id=parseInt(e.target.dataset.id); const q=parseInt(e.target.value)||1; cartApi.updateQty(id,q); renderCart(); }));

      // checkout summary
      const total = items.reduce((s,i)=> s + (i.price * (i.qty||1) * (1 - (i.discount||0)/100)),0).toFixed(2);
      document.getElementById('checkout').innerHTML = `<h4>Order Summary</h4><div class="small">Items: ${items.length}</div><div style="margin-top:8px"><strong>Total: $${total}</strong></div><div style="margin-top:12px"><h4>Checkout</h4><div class="form-row"><label class="label">Name</label><input id="cname" class="input"></div><div class="form-row"><label class="label">Address</label><input id="caddr" class="input"></div><div class="form-row"><label class="label">Mobile</label><input id="cmobile" class="input"></div><div class="form-row"><label class="label">Payment Mode</label><select id="pmode" class="input"><option>Cash on delivery</option><option>Credit Card</option></select></div><div style="margin-top:8px"><button id="place" class="btn">Place Order</button></div></div>`;
      document.getElementById('place').addEventListener('click', ()=>{
        // create order
        const orders = JSON.parse(localStorage.getItem('orders')||'[]');
        const cu = JSON.parse(localStorage.getItem('currentUser'));
        const newOrder = {id:Date.now(), userEmail: cu.email, items: items, total: total, date: new Date().toISOString().slice(0,10)};
        orders.push(newOrder); localStorage.setItem('orders', JSON.stringify(orders));
        // clear cart
        localStorage.removeItem('cart');
        alert('Order placed successfully!');
        window.location.href='index.html';
      });
    }
  </script>
</body>
</html>
